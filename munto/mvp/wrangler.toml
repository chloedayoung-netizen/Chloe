name = "character-chat-mvp"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# OpenRouter 모델 ID. 실험 전 openrouter.ai/models 에서 한국어 롤플레이가 자연스럽고
# 1회 응답 비용이 낮은 모델을 2~3개 직접 써 보고 정한다. (아래는 자리표시 — 반드시 바꿀 것)
MODEL = "CHANGE-ME/model-id"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
MAX_TOKENS = "400"
FREE_TURNS_PER_DAY = "30"
BONUS_TURNS = "10"

# 비밀값은 여기에 쓰지 말고 아래 명령으로 등록:
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put SHEET_WEBHOOK_URL
#   npx wrangler secret put SHEET_TOKEN
